<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Current Workflow - Case Summary AI</title>
  <desc id="desc">High-level flow showing the current ServiceNow-native AI summary workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6" />
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed" />
    </marker>
    <style><![CDATA[
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #4b5563; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
      .laneTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxBlue { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; rx: 14; }
      .boxGreen { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 14; }
      .boxPurple { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .boxAmber { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .boxGray { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 2; rx: 14; }
      .text { font: 600 15px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #374151; }
      .note { font: 700 13px Arial, sans-serif; fill: #6d28d9; }
      .arrow { stroke: #3b82f6; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowDashed { stroke: #7c3aed; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowDashed); }
    ]]></style>
  </defs>

  <text x="50" y="50" class="title">Current Workflow - Case Summary AI</text>
  <text x="50" y="78" class="subtitle">Rough manager view of how the ServiceNow-native flow works today</text>

  <rect x="40" y="110" width="250" height="780" class="lane" />
  <text x="60" y="145" class="laneTitle">1. User / ServiceNow UI</text>

  <rect x="330" y="110" width="560" height="780" class="lane" />
  <text x="350" y="145" class="laneTitle">2. ServiceNow Server Logic</text>

  <rect x="930" y="110" width="220" height="780" class="lane" />
  <text x="950" y="145" class="laneTitle">3. Cisco CIRCUIT</text>

  <rect x="1180" y="110" width="180" height="780" class="lane" />
  <text x="1200" y="145" class="laneTitle">4. Optional Saved View</text>

  <rect x="70" y="190" width="190" height="70" class="boxGray" />
  <text x="95" y="220" class="text">Open case / incident</text>
  <text x="102" y="242" class="small">Agent is on the record form</text>

  <rect x="70" y="300" width="190" height="78" class="boxBlue" />
  <text x="107" y="330" class="text">Click AI Summary</text>
  <text x="85" y="352" class="small">UI Action calls</text>
  <text x="90" y="370" class="small">generateAISummary()</text>

  <rect x="70" y="420" width="190" height="84" class="boxAmber" />
  <text x="91" y="450" class="text">Loading modal appears</text>
  <text x="83" y="472" class="small">User sees progress while</text>
  <text x="95" y="490" class="small">summary is generated</text>

  <rect x="70" y="720" width="190" height="96" class="boxGreen" />
  <text x="86" y="750" class="text">Summary modal shown</text>
  <text x="84" y="772" class="small">Issue / Action Taken /</text>
  <text x="114" y="790" class="small">Resolution</text>

  <rect x="380" y="190" width="460" height="72" class="boxBlue" />
  <text x="476" y="220" class="text">GlideAjax -> CaseSummaryAI.getSummary</text>
  <text x="448" y="242" class="small">Client sends sys_id and table to Script Include</text>

  <rect x="380" y="300" width="460" height="84" class="boxGray" />
  <text x="547" y="330" class="text">_runPipeline()</text>
  <text x="420" y="352" class="small">Starts the current ServiceNow-native summarization flow</text>
  <text x="470" y="370" class="small">and validates the record</text>

  <rect x="380" y="425" width="460" height="110" class="boxGreen" />
  <text x="495" y="455" class="text">Fetch ServiceNow data</text>
  <text x="420" y="477" class="small">- Case / incident fields</text>
  <text x="420" y="497" class="small">- Journal entries: comments + work notes</text>
  <text x="420" y="517" class="small">- Related emails</text>

  <rect x="380" y="575" width="460" height="92" class="boxAmber" />
  <text x="474" y="605" class="text">Build clean timeline + prompt</text>
  <text x="425" y="627" class="small">Chronological timeline is assembled and converted</text>
  <text x="453" y="645" class="small">into a concise handoff prompt</text>

  <rect x="380" y="705" width="220" height="90" class="boxPurple" />
  <text x="432" y="735" class="text">Get OAuth token</text>
  <text x="421" y="757" class="small">Client credentials flow</text>
  <text x="425" y="775" class="small">against Cisco token URL</text>

  <rect x="620" y="705" width="220" height="90" class="boxPurple" />
  <text x="668" y="735" class="text">Call CIRCUIT LLM</text>
  <text x="643" y="757" class="small">POST chat completion</text>
  <text x="639" y="775" class="small">with prompt and app key</text>

  <rect x="960" y="290" width="160" height="110" class="boxPurple" />
  <text x="988" y="320" class="text">CIRCUIT LLM</text>
  <text x="987" y="342" class="small">Reads prompt and</text>
  <text x="991" y="360" class="small">returns structured</text>
  <text x="1008" y="378" class="small">summary</text>

  <rect x="380" y="825" width="460" height="80" class="boxBlue" />
  <text x="465" y="855" class="text">Parse sections and return JSON</text>
  <text x="423" y="877" class="small">ServiceNow sends result back to the browser for display</text>

  <rect x="1205" y="320" width="130" height="95" class="boxGray" />
  <text x="1227" y="350" class="text">UI Macro panel</text>
  <text x="1227" y="372" class="small">Displays saved</text>
  <text x="1231" y="390" class="small">summary field</text>

  <rect x="1205" y="470" width="130" height="120" class="boxGray" />
  <text x="1226" y="500" class="text">Not main path</text>
  <text x="1218" y="522" class="small">Current button flow</text>
  <text x="1222" y="540" class="small">previews summary.</text>
  <text x="1214" y="558" class="small">Auto-save is optional</text>
  <text x="1245" y="576" class="small">today.</text>

  <path d="M165 260 L165 300" class="arrow" />
  <path d="M165 378 L165 420" class="arrow" />
  <path d="M260 339 L380 226" class="arrow" />
  <path d="M610 262 L610 300" class="arrow" />
  <path d="M610 384 L610 425" class="arrow" />
  <path d="M610 535 L610 575" class="arrow" />
  <path d="M490 667 L490 705" class="arrow" />
  <path d="M600 750 L620 750" class="arrow" />
  <path d="M840 750 C910 750, 920 400, 960 345" class="arrow" />
  <path d="M960 400 C900 520, 860 760, 840 845" class="arrow" />
  <path d="M380 865 C300 865, 290 768, 260 768" class="arrow" />
  <path d="M840 845 C1010 845, 1090 600, 1205 540" class="arrowDashed" />
  <path d="M1270 415 L1270 470" class="arrowDashed" />

  <text x="900" y="815" class="note">optional save/display path</text>

  <rect x="50" y="915" width="1300" height="45" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="10" />
  <text x="70" y="942" class="small">Current live path: click button -> generate summary in ServiceNow -> call CIRCUIT LLM -> show result in popup. Saved panel exists as a separate optional display path.</text>
</svg>